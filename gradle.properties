# Gradle stuff
org.gradle.jvmargs=-Xmx8192M
org.gradle.parallel=true
org.gradle.caching=true

# Mod Info
mod_id=serverchan
mod_version=1.0.2
## use topLevelDomain.yourName.modID
maven_group=net.himeki
mod_name=ServerChan
mod_description=ServerChan Mod
mod_license=MIT
# Note: In forge's mods.toml this is hard coded because Architectury throws an error with setting it as a variable
mod_authors=["Grider"]
mod_homepage=https://github.com/himekifee/ServerChan
mod_source=https://github.com/himekifee/ServerChan
mod_issues=https://github.com/himekifee/ServerChan/issues
mod_discord=
forgeUpdateJSONURL=https://api.modrinth.com/updates/serverchan/forge_updates.json
neoforgeUpdateJSONURL=https://api.modrinth.com/updates/serverchan/forge_updates.json?neoforge=only

# Global Plugin Versions
manifold_version=2025.1.27
# 2023.1.17 / 2023.1.33 can be used if there are mystery Java compiler issues //else: 2024.1.13

## left here as examples
#log4j_version=2.23.1
#lwjgl_version=3.3.1
##

# Internal Properties (These are set at runtime for Forgix to merge jar's)
versionStr=

# This defines what MC version Intellij will use for the preprocessor
# and what version is used automatically by build and run commands
mcVer=1.21

# Publishing information
# can be changed per version with "fabric_is_quilt_compatible" in version properties
default_quilt_compatibility=true
publish_debug_mode=false
modrinth_id=frZpQL6O
curseforge_id=1393571
# Type of release: "beta", "alpha" or "release"
release_type=release
# Curseforge Environment tag: "server", "client" or "both"
curse_environment=both
github_draft=true
github_target=main

# Defines the maximum amount of memory Minecraft is allowed when run in a development environment
#minecraftMemoryJavaArg="-Xmx4G"
