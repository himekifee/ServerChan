plugins {
    id "com.github.johnrengelman.shadow"
}

repositories {
    maven {
        name "Spigot"
        url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    mavenCentral()
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:${rootProject.spigot_api_version}") {
        // Exclude bungeecord-chat SNAPSHOT dependency - old SNAPSHOTs are not available
        // in public repos. The API classes are already included in spigot-api jar.
        exclude group: 'net.md-5', module: 'bungeecord-chat'
    }

    // Implementation from common including all transitive dependencies
    implementation(project(":common"))
}

// Shadow configuration is handled by the root build.gradle
// to ensure consistent relocation paths across all platforms

task deleteResources(type: Delete) {
    delete file("build/resources/main")
}

processResources {
    dependsOn(copyCoreResources)
    dependsOn(copyCommonLoaderResources)
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
